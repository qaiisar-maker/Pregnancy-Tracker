:root{
  --bg:#F8F4EF;--bg2:#F0E9E1;--card:#FFFFFF;--ink:#3B322C;--muted:#7A6E64;--faint:#A69A8F;--line:#EAE1D8;
  --primary:#A7726C;--primary-h:#93625C;--on-primary:#FFFFFF;--primary-soft:#F3E3DF;--primary-ink:#7A4F49;
  --accent:#B59A82;--accent-soft:#EDE5DA;--accent-ink:#6B5544;
  --gold:#C29545;--gold-soft:#F5EBD8;--rose:#C98E8A;--rose-soft:#F6E4E1;--rose-ink:#8E4F4B;--slate:#8A95AA;
  --hero:linear-gradient(135deg,#F4E2DE 0%,#EFE6DB 100%);
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;--fs:16px;--shadow:0 1px 2px rgba(60,40,30,.05),0 6px 20px rgba(60,40,30,.05);
}
[data-theme="rose"]{--bg:#FBF4F3;--bg2:#F5E9E8;--line:#EEDFDE;--primary:#B85F6C;--primary-h:#A44F5C;--primary-soft:#F6E1E1;--primary-ink:#8E4653;--accent:#D49AA3;--accent-soft:#F8E8EA;--accent-ink:#8E4653;--hero:linear-gradient(135deg,#F6E1E1 0%,#FBEFEF 100%)}
[data-theme="sage"]{--bg:#F7F5F1;--bg2:#EFEDE7;--line:#E6E3DC;--ink:#33302E;--primary:#5E7A55;--primary-h:#4F6A47;--primary-soft:#E2EADB;--primary-ink:#3D5236;--accent:#C9858C;--accent-soft:#F5E2E3;--accent-ink:#8E4B53;--hero:linear-gradient(135deg,#F5E2E3 0%,#E2EADB 100%)}
[data-theme="night"]{--bg:#1F1B1A;--bg2:#2A2524;--card:#2A2524;--ink:#EEE7E3;--muted:#B5AAA4;--faint:#857A75;--line:#3C3532;
  --primary:#D9A39D;--primary-h:#E6B5AF;--on-primary:#1F1B1A;--primary-soft:#45322F;--primary-ink:#F2D2CD;
  --accent:#CBB49E;--accent-soft:#3E352D;--accent-ink:#E9DACB;--gold:#D8B06A;--gold-soft:#433822;--rose:#D79BA1;--rose-soft:#4A3134;--rose-ink:#F0C6CA;
  --hero:linear-gradient(135deg,#3A2B29 0%,#332C25 100%);--shadow:0 1px 2px rgba(0,0,0,.3)}
[data-size="s"]{--fs:15px}[data-size="l"]{--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif,.tile .v,.stat .v{font-feature-settings:"lnum" 1;font-variant-numeric:lining-nums}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:2.1rem;line-height:1.1}h2{font-size:1.55rem;line-height:1.15}h3{font-size:1.2rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.eyebrow{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.15rem;display:block;line-height:1.1;white-space:nowrap}
.brand small{font-size:.62rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem}
.tab:hover{background:var(--bg2)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.botnav{display:none}
main{max-width:1040px;margin:0 auto;padding:22px 18px 110px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card,.stack>*+*{margin-top:14px}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.tile .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tile .s{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--serif);font-size:1.7rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols>*{margin-top:0!important}
.scale button b svg{width:1.4em;height:1.4em}
.stat .l{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:2px}
.stat .s{font-size:.75rem;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn.danger{color:#B3473F}
.btn svg,.ico{width:16px;height:16px;flex:none}
.link{background:none;border:0;padding:0;color:var(--primary-ink);cursor:pointer;font-size:.85rem;font-weight:500}
[data-theme="night"] .link{color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.74rem;background:var(--primary-soft);color:var(--primary-ink)}
.pill.lav{background:var(--accent-soft);color:var(--accent-ink)}
.pill.gold{background:var(--gold-soft);color:#7A5A1E}[data-theme="night"] .pill.gold{color:var(--gold)}
.pill.rose{background:var(--rose-soft);color:var(--rose-ink)}
/* chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.84rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.on.s2{background:color-mix(in srgb,var(--accent) 30%,var(--card))}
.chip.on.s3{background:var(--accent);color:#fff}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.scale button b{display:block;font-size:1.25rem;color:var(--ink);font-weight:400}
.scale button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.sec{margin-top:18px}.sec>h4{margin:0 0 8px;font-size:.9rem;font-weight:600}
/* lists */
.list>div{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.grow{flex:1;min-width:0}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.mi:hover{border-color:var(--faint)}
.mi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary-ink)}
.mi .ic.lav{background:var(--accent-soft);color:var(--accent-ink)}
.mi .ic.gold{background:var(--gold-soft);color:var(--gold)}
.mi .ic.rose{background:var(--rose-soft);color:var(--rose-ink)}
.mi b{font-weight:500;font-size:.92rem;display:block}.mi span{font-size:.76rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
/* insights */
.ins{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 12px 12px 4px;padding:12px 14px;background:var(--card)}
.ins.sage{border-left-color:var(--primary)}.ins.gold{border-left-color:var(--gold)}.ins.rose{border-left-color:var(--rose)}.ins.slate{border-left-color:var(--slate)}
.ins .eyebrow{margin-bottom:4px}
.ins p{font-size:.88rem;margin:0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{text-align:center;font-size:.66rem;letter-spacing:.1em;color:var(--faint);font-weight:600;padding:4px 0}
.cd{aspect-ratio:1/0.82;border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.cd:hover{border-color:var(--faint)}
.cd .n{font-size:.82rem}
.cd.out{opacity:.35}
.cd.bleed{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.cd.spot{background:color-mix(in srgb,var(--rose-soft) 50%,var(--bg))}
.cd.today{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.74rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--faint);font-family:var(--sans)}
.bar-row{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.84rem;padding:4px 0}
.bar-bg{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar-fg{height:100%;background:var(--accent);border-radius:99px}
/* accordion */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
details.acc summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:.92rem}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:.2s}
details.acc[open] summary:after{transform:rotate(-135deg)}
details.acc .b{padding:0 14px 14px 14px;font-size:.88rem;color:var(--muted)}
.note{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:.82rem;color:var(--muted)}
.private{background:var(--primary-soft);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:14px;padding:14px 16px;color:var(--primary-ink)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,32,28,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:620px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:up .2s}
.sheet .hd{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .bd{padding:6px 20px 20px;overflow:auto}
.sheet .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:var(--bg2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.86rem;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--bg);font-weight:600;cursor:pointer;text-decoration:underline}
.foot{text-align:center;font-size:.72rem;color:var(--faint);margin-top:30px}
.swatch{display:flex;gap:4px}.swatch i{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--card);display:flex;align-items:center;gap:10px;font-size:.86rem}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
#print{display:none}
@media (max-width:760px){
  h1{font-size:1.75rem}
  .tabs{display:none}
  .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .botnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--faint);padding:4px 0;cursor:pointer}
  .botnav button svg{width:22px;height:22px}
  .botnav button.on{color:var(--primary)}
  main{padding:16px 14px 100px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu{grid-template-columns:minmax(0,1fr)}
  .cal{gap:3px}.cd{border-radius:8px;padding:3px 2px}.dot{width:5px;height:5px}
  .bar-row{grid-template-columns:100px minmax(0,1fr) 82px;font-size:.78rem}.bar-row>span:last-child{white-space:nowrap}
  .ov{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:94vh}
}
@media print{
  body{background:#fff;color:#000}
  .top,.botnav,main,.ov,.toast{display:none!important}
  #print{display:block;padding:0;font-size:11pt}
  #print h1{font-size:22pt}#print h2{font-size:15pt;margin-top:16px}
  #print table{width:100%;border-collapse:collapse;margin-top:6px}
  #print td,#print th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left;font-size:10pt}
}

.tile .v,.stat .v{font-family:'QDigits',var(--serif);}

/* pregnancy extras */
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:var(--serif);fill:var(--ink)}
.bigtap{width:190px;height:190px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);font-family:var(--serif);font-size:2.6rem;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 35%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px auto;transition:transform .08s}
.bigtap:active{transform:scale(.96)}
.bigtap small{font-family:var(--sans);font-size:.8rem;opacity:.85}
.bigtap.stop{background:var(--accent)}
.prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.chk{width:20px;height:20px;accent-color:var(--primary);flex:none;cursor:pointer}
.done-t{text-decoration:line-through;color:var(--faint)}
.wk{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:8px}
.wk summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px}
.wk summary::-webkit-details-marker{display:none}
.wk.cur{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.wk .num{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-family:var(--serif);font-size:1.3rem;flex:none}
.wk .b{padding:0 14px 14px 70px;font-size:.88rem;color:var(--muted)}
.emoji{font-size:1.6rem;line-height:1}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.photo{border-radius:12px;overflow:hidden;background:var(--bg2);aspect-ratio:3/4;position:relative;cursor:pointer;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px}
.photo.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;gap:6px}
.star{background:none;border:0;cursor:pointer;color:var(--faint);font-size:1.2rem;line-height:1;padding:2px}
.star.on{color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl td,.tbl th{padding:8px 6px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-top:0}
.num-r{text-align:right!important;white-space:nowrap}

.bigtap span,.stat .v,.tile .v{font-family:'QDigits',var(--serif)}
.g3.keep{grid-template-columns:repeat(3,minmax(0,1fr))!important}

</style>
</head>

let toastT;
function toast(msg, undo){

  const t = document.createElement('div'); t.className='toast'; t.innerHTML = `<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
  document.body.appendChild(t);

function modal(title, body, foot, opts={}){
  closeModal();
  const ov = document.createElement('div'); ov.className='ov'; ov.id='ov';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2 style="font-size:1.4rem">${title}</h2><button class="x" aria-label="Close">${ic('x')}</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target===ov && !opts.sticky) closeModal(); });
  $('.x', ov).onclick = closeModal;
  document.body.style.overflow='hidden';
  return ov;
}
function closeModal(){ const o=$('#ov'); if(o){ o.remove(); document.body.style.overflow=''; } }
function confirmBox(msg, yes, label='Delete'){

/* ---------- charts (pure SVG, offline) ---------- */
function barChart(vals, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||150, pl=24, pb=20, pt=8, n=vals.length, max=Math.max(o.max||0, ...vals, 1);
  const bw=(W-pl)/n, gap=Math.min(6, bw*.3);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let g=0; g<=2; g++){ const y=pt+(H-pt-pb)*(1-g/2); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${g?'3 4':''}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${r1(max*g/2).replace(/\.0$/,'')}</text>`; }
  vals.forEach((v,i)=>{ const h=(H-pt-pb)*(v/max), x=pl+i*bw+gap/2, y=H-pb-h;
    if (v>0) s+=`<rect x="${x}" y="${y}" width="${Math.max(bw-gap,1.5)}" height="${h}" rx="${Math.min(3,(bw-gap)/2)}" fill="${o.color||'var(--gold)'}"><title>${esc(labels[i]||'')}: ${r1(v)}</title></rect>`;
    const every = o.every || Math.ceil(n/8);
    if (labels[i] && i%every===0) s+=`<text x="${x+(bw-gap)/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function lineChart(series, labels, o={}){
  const W=o.w||(innerWidth<760?380:640), H=o.h||160, pl=24, pb=20, pt=10, n=labels.length, min=o.min??0, max=o.max??Math.max(...series.flatMap(s=>s.vals.filter(v=>v!=null)),1);
  const X=i=>pl+(n<=1?0:(W-pl-8)*i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = o.ticks || [min,(min+max)/2,max];
  ticks.forEach(t=>{ s+=`<line x1="${pl}" x2="${W}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${o.fmt?o.fmt(t):r1(t).replace(/\.0$/,'')}</text>`; });
  const every = o.every || Math.ceil(n/7);
  labels.forEach((l,i)=>{ if(i%every===0) s+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(se=>{
    let d='', area='', started=false, lastX=0, firstX=0;
    se.vals.forEach((v,i)=>{ if(v==null) return; d+=(started?'L':'M')+X(i)+' '+Y(v)+' '; if(!started) firstX=X(i); started=true; lastX=X(i); });
    if (!started) return;
    if (se.fill) s+=`<path d="${d}L${lastX} ${H-pb} L${firstX} ${H-pb} Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="var(--card)" stroke="${se.color}" stroke-width="1.6"><title>${esc(labels[i])}: ${o.fmt?o.fmt(v):r1(v)}</title></circle>`; });
  });
  return s+'</svg>';
}

function preg(){
  const s = DB.settings, t = todayKey();
  if (s.born) return {born:true, age:diffDays(s.born, t)};
  if (!s.due) return null;
  const left = diffDays(t, s.due), gd = 280 - left;
  const w = Math.floor(gd/7), d = ((gd%7)+7)%7;
  return {gd, w, d, left, tri: w<14?1:w<28?2:3, pct:Math.max(0,Math.min(1,gd/280))};
}

    ${T('Overall', d.overall?FACES[d.overall]:'—', d.overall?OVERALL[d.overall-1][1]:'Not logged')}

/* ---------- check-in ---------- */
ACT.checkin = (k=todayKey()) => {

  const body = `
    <div class="sec"><label class="f">Date</label><input type="date" id="ci-date" value="${k}" max="${todayKey()}"></div>
    <div class="sec"><h4>How was the day?</h4>${scale('overall', OVERALL.map(([v,l])=>[v,l,FACES[v]]))}</div>
    <div class="sec"><h4>Energy</h4>${scale('energy', [[1,'Very low'],[2,'Low'],[3,'Moderate'],[4,'Good'],[5,'High']])}</div>
    <div class="sec"><h4>Mood <span class="faint small">· choose any</span></h4><div class="chips" id="ci-mood">${P_MOODS.map(m=>`<button type="button" class="chip ${d.mood.includes(m)?'on':''}" data-v="${m}">${m}</button>`).join('')}</div></div>
    <div class="sec"><h4>Sleep last night</h4><div class="grid g2"><div><label class="f">Hours</label><input type="number" id="ci-hrs" step="0.25" min="0" max="16" value="${d.sleepHours??''}" placeholder="7.5"></div></div><div style="margin-top:10px">${scale('sleepQuality', [[1,'Very poor'],[2,'Poor'],[3,'Fair'],[4,'Good'],[5,'Great']])}</div></div>
    <div class="sec"><h4>Symptoms <span class="faint small">· tap again for stronger: mild → moderate → strong</span></h4><div class="chips" id="ci-sym">${P_SYMPTOMS.map(s=>{const v=d.symptoms[s]||0;return `<button type="button" class="chip ${v?'on s'+v:''}" data-v="${s}">${s}${v?` · ${['','mild','moderate','strong'][v]}`:''}</button>`;}).join('')}</div></div>
    <div class="grid g2 sec"><div><label class="f">Water (glasses)</label><div class="row" style="flex-wrap:nowrap"><button class="btn sm" type="button" data-w="-1">−</button><input type="number" id="ci-water" min="0" max="20" value="${d.water??''}" placeholder="0" style="text-align:center"><button class="btn sm" type="button" data-w="1">+</button></div></div><div><label class="f">Weight (${unit()}) <span class="faint">optional</span></label><input type="number" id="ci-wt" step="0.1" value="${wv?wv.value:''}"></div></div>
    <div class="sec"><h4>Note</h4><textarea id="ci-note" placeholder="Felt the first little flutter tonight!">${esc(d.note||'')}</textarea></div>`;
  const ov = modal(day(k)?'Update check-in':'Daily check-in', body, `${day(k)?'<button class="btn danger ghost" data-del style="margin-right:auto">Delete day</button>':''}<button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save check-in</button>`, {sticky:true});
  $$('.scale',ov).forEach(sc=>sc.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const f=sc.dataset.f,v=+b.dataset.v;d[f]=d[f]===v?undefined:v;$$('button',sc).forEach(x=>x.classList.toggle('on',x===b&&d[f]!==undefined));}));
  $('#ci-mood',ov).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v,i=d.mood.indexOf(v);i>=0?d.mood.splice(i,1):d.mood.push(v);b.classList.toggle('on',i<0);});
  $('#ci-sym',ov).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=b.dataset.v;const v=((d.symptoms[s]||0)+1)%4;if(v)d.symptoms[s]=v;else delete d.symptoms[s];b.className='chip'+(v?' on s'+v:'');b.textContent=s+(v?` · ${['','mild','moderate','strong'][v]}`:'');});
  $$('[data-w]',ov).forEach(b=>b.onclick=()=>{const i=$('#ci-water',ov);i.value=Math.max(0,(+i.value||0)+ +b.dataset.w);});
  $('[data-c]',ov).onclick = closeModal;
  const del = $('[data-del]',ov); if (del) del.onclick = () => confirmBox(`This removes the check-in for ${fmtLong(k)}.`, ()=>{ delete DB.days[k]; save(); render(); toast('Check-in deleted'); });
  $('[data-s]',ov).onclick = () => {
    const nk = $('#ci-date',ov).value || k;
    const h = parseFloat($('#ci-hrs',ov).value); d.sleepHours = isNaN(h)?undefined:h;
    const wa = parseInt($('#ci-water',ov).value); d.water = isNaN(wa)?undefined:wa;
    d.note = $('#ci-note',ov).value.trim() || undefined;
    Object.keys(d).forEach(x=>{ if(d[x]===undefined || (Array.isArray(d[x])&&!d[x].length)) delete d[x]; });
    if (!Object.keys(d.symptoms||{}).length) delete d.symptoms;
    if (nk!==k) delete DB.days[k];
    DB.days[nk] = d;
    const wt = parseFloat($('#ci-wt',ov).value);
    DB.weights = DB.weights.filter(x=>x.date!==nk); if (!isNaN(wt)) { DB.weights.push({date:nk, value:wt}); DB.weights.sort((a,b)=>a.date.localeCompare(b.date)); }
    save(); closeModal(); render(); toast(`Check-in saved for ${fmtShort(nk)}`);
  };
};

/* ---------- photo storage (IndexedDB, stays on device) ---------- */
const PH = {cache:{}, db:null};
function phDB(){ return PH.db || (PH.db = new Promise((res,rej)=>{ try { const r=indexedDB.open(APP.photoDB,1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); } catch(e){ rej(e); } })); }
async function phPut(id, data){ const db=await phDB(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>{PH.cache[id]=data;res();}; t.onerror=()=>rej(t.error); }); }
async function phGet(id){ if (PH.cache[id]) return PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ PH.cache[id]=r.result; res(r.result); }; r.onerror=()=>res(null); }); }
async function phDel(id){ delete PH.cache[id]; const db=await phDB(); return new Promise(res=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').delete(id); t.oncomplete=res; t.onerror=res; }); }
async function phAll(){ const db=await phDB(); return new Promise(res=>{ const out={}; const r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
function shrink(file, max=1200){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function pickPhoto(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=async()=>{ if(!i.files[0]) return res(null); try{ res(await shrink(i.files[0])); }catch(e){ toast("That image couldn't be opened."); res(null);} }; i.click(); }); }
afterRender = () => { $$('img[data-photo]').forEach(async im=>{ const d=await phGet(im.dataset.photo).catch(()=>null); if(d) im.src=d; else im.closest('.photo')?.classList.add('missing'); }); };

/* ---------- journal ---------- */
let promptIx = Math.floor(Math.random()*PROMPTS.length);
function vJournal(){
  const q = S.jq.toLowerCase();

}
ACT.nextPrompt = () => { promptIx=(promptIx+1)%PROMPTS.length; $('#jp').textContent = PROMPTS[promptIx]; };
ACT.writeJ = id => {

ACT.delJ = id => confirmBox('This journal entry will be removed permanently.', async()=>{ const j=DB.journal.find(x=>x.id===id); if (j?.photo) await phDel(j.photo); DB.journal = DB.journal.filter(x=>x.id!==id); save(); render(); toast('Entry deleted'); });

/* ---------- plan hub ---------- */
function ensureLists(){ Object.keys(LISTS).forEach(k=>{ if (!Array.isArray(DB.lists[k])) DB.lists[k] = defaultsFor(k); }); }
function defaultsFor(k){ const d=LIST_DEFAULTS[k]; if(!d) return []; const out=[]; Object.entries(d).forEach(([cat,items])=>items.forEach(t=>out.push({id:uid()+out.length, text:t, cat, done:false}))); return out; }
const money = v => (v==null||isNaN(v)) ? '—' : '$'+(+v).toLocaleString(undefined,{maximumFractionDigits:0});
function vPlan(){
  if (S.sub){ const f = S.sub==='birthplan'?vBirthPlan : S.sub==='nursery'?vNursery : LISTS[S.sub]?()=>vList(S.sub):null; if (f) return `<button class="link back" data-go="plan">${ic('left')} Plan</button>` + f(); }
  const card = (k,t,s,i,meta,pct) => `<button class="mi" data-go="plan" data-sub="${k}" style="flex-direction:column;align-items:stretch;gap:10px"><span class="row" style="flex-wrap:nowrap"><span class="ic">${ic(i)}</span><span class="grow"><b>${t}</b><span>${s}</span></span>${ic('right')}</span>${pct!=null?`<span class="prog"><i style="width:${pct}%"></i></span>`:''}<span class="tiny faint" style="text-align:left">${meta}</span></button>`;
  const L = k => DB.lists[k]||[];
  const pc = k => L(k).length ? Math.round(L(k).filter(i=>i.done).length/L(k).length*100) : 0;
  const bp = BIRTHPLAN.filter(([k])=>(DB.birthplan[k]||'').trim()).length;
  const bud = L('budget'), spent = bud.reduce((s,i)=>s+(+i.actual||0),0), plan = bud.reduce((s,i)=>s+(+i.planned||0),0);
  return `<h1>Plan & prepare</h1><p class="muted">Everything to get ready for baby, in one calm place. Every list is pre-filled with ideas — edit anything.</p>
  <div class="menu" style="margin-top:16px">
    ${card('todo','To-do by trimester','Checklists from first appointment to home','list',`${L('todo').filter(i=>i.done).length} of ${L('todo').length} done`,pc('todo'))}
    ${card('bag','Hospital bag','For you, baby and your partner','bag',`${L('bag').filter(i=>i.done).length} of ${L('bag').length} packed`,pc('bag'))}
    ${card('birthplan','Birth plan','Your preferences, ready to print','clip',`${bp} of ${BIRTHPLAN.length} sections written`,Math.round(bp/BIRTHPLAN.length*100))}
    ${card('names','Baby names','Your shortlist and favorites','baby',`${L('names').length} names · ${L('names').filter(i=>i.done).length} favorites`,null)}
    ${card('registry','Registry & shopping','What baby needs and what you have','cart',`${L('registry').filter(i=>i.done).length} of ${L('registry').length} items`,pc('registry'))}
    ${card('budget','Baby budget','Planned costs and spending','wallet',`${money(spent)} spent of ${money(plan)} planned`,plan?Math.min(100,Math.round(spent/plan*100)):0)}
    ${card('nursery','Nursery ideas','Colors, notes and inspiration photos','home2',`${(DB.nursery.photos||[]).length} photos`,null)}
    ${card('guests','Baby shower guests','RSVPs, gifts and thank-yous','gift',`${L('guests').length} invited · ${L('guests').filter(i=>i.rsvp==='Yes').length} coming`,null)}
    ${card('meals','Freezer meals','Cook ahead for the newborn weeks','bowl',`${L('meals').filter(i=>i.done).length} of ${L('meals').length} made`,pc('meals'))}
    ${card('postpartum','Postpartum prep','Recovery, feeding and support','heart',`${L('postpartum').filter(i=>i.done).length} of ${L('postpartum').length} ready`,pc('postpartum'))}
  </div>`;
}

/* ---------- generic list ---------- */
function fieldVal(cfg, it){ return cfg.fields.map(([k,l,t])=>{ const v=it[k]; if (v==null||v==='') return ''; if (t==='number' && (k==='price'||k==='planned'||k==='actual')) return `${l}: ${money(v)}`; if (k==='link') return `<a href="${esc(/^https?:/.test(v)?v:'https://'+v)}" target="_blank" rel="noopener" class="link">Open link</a>`; if (k==='rsvp') return v==='—'?'':`RSVP: ${esc(v)}`; return `${l}: ${esc(v)}`; }).filter(Boolean).join(' · '); }
function vList(key){
  const cfg = LISTS[key], items = DB.lists[key]||[], star = cfg.done==='star';
  let summary = '';
  if (key==='budget'){ const p=items.reduce((s,i)=>s+(+i.planned||0),0), a=items.reduce((s,i)=>s+(+i.actual||0),0); summary = `<div class="card" style="margin-top:14px"><div class="grid g3"><div class="stat"><div class="v">${money(p)}</div><div class="l">Planned</div></div><div class="stat"><div class="v">${money(a)}</div><div class="l">Spent</div></div><div class="stat"><div class="v">${money(p-a)}</div><div class="l">${p-a>=0?'Remaining':'Over plan'}</div></div></div></div>`; }
  if (key==='registry'){ const t=items.reduce((s,i)=>s+(+i.price||0),0), g=items.filter(i=>i.done).reduce((s,i)=>s+(+i.price||0),0); summary = `<div class="card" style="margin-top:14px"><div class="grid g3"><div class="stat"><div class="v">${items.filter(i=>i.done).length}/${items.length}</div><div class="l">Items</div></div><div class="stat"><div class="v">${money(t)}</div><div class="l">Total value</div></div><div class="stat"><div class="v">${money(t-g)}</div><div class="l">Still needed</div></div></div></div>`; }
  if (key==='guests'){ const inv=items.reduce((s,i)=>s+(+i.count||1),0), yes=items.filter(i=>i.rsvp==='Yes').reduce((s,i)=>s+(+i.count||1),0); summary = `<div class="card" style="margin-top:14px"><div class="grid g4"><div class="stat"><div class="v">${inv}</div><div class="l">Invited</div></div><div class="stat"><div class="v">${yes}</div><div class="l">Coming</div></div><div class="stat"><div class="v">${items.filter(i=>i.gift).length}</div><div class="l">Gifts noted</div></div><div class="stat"><div class="v">${items.filter(i=>i.done).length}</div><div class="l">Thank-yous sent</div></div></div></div>`; }
  return `<h1>${cfg.title}</h1><p class="muted">${cfg.sub}</p>${summary}
  ${cfg.cats.map(cat=>{ const ci = items.filter(i=>i.cat===cat); const dn = ci.filter(i=>i.done).length;
    return `<div class="card" style="margin-top:14px"><div class="between"><h3>${esc(cat)}</h3>${ci.length&&!star?`<span class="small faint">${dn}/${ci.length} ${cfg.doneLabel.toLowerCase()}</span>`:''}</div>
    ${ci.length&&!star?`<div class="prog" style="margin:8px 0"><i style="width:${Math.round(dn/ci.length*100)}%"></i></div>`:''}
    <div class="list">${ci.map(it=>`<div>${star?`<button class="star ${it.done?'on':''}" data-act="tog" data-arg="${key}|${it.id}" aria-label="Favorite">${it.done?'★':'☆'}</button>`:`<input type="checkbox" class="chk" data-act="tog" data-arg="${key}|${it.id}" ${it.done?'checked':''} aria-label="${cfg.doneLabel}">`}<div class="grow"><span class="${it.done&&['todo','bag','registry','meals','postpartum'].includes(key)?'done-t':''}">${esc(it.text)}</span>${fieldVal(cfg,it)?`<div class="small muted">${fieldVal(cfg,it)}</div>`:''}</div><button class="btn ghost sm" data-act="itemEdit" data-arg="${key}|${it.id}">Edit</button></div>`).join('')}</div>
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" class="addin" data-key="${key}" data-cat="${esc(cat)}" placeholder="Add to ${esc(cat.toLowerCase())}…"><button class="btn sm" data-act="itemAdd" data-arg="${key}|${esc(cat)}" aria-label="Add">${ic('plus')}</button></div></div>`; }).join('')}
  ${LIST_DEFAULTS[key]?`<p style="margin-top:14px"><button class="link" data-act="listReset" data-arg="${key}">Restore suggested items</button></p>`:''}`;
}
ACT.tog = arg => { const [k,id]=arg.split('|'); const it=(DB.lists[k]||[]).find(x=>x.id===id); if(!it) return; it.done=!it.done; save(); render(); };
ACT.itemAdd = arg => { const [k,cat]=arg.split('|'); const inp=$$('.addin').find(i=>i.dataset.key===k&&i.dataset.cat===cat); const v=inp?.value.trim(); if(!v){ inp?.focus(); return; } DB.lists[k].push({id:uid(), text:v, cat, done:false}); save(); render(); setTimeout(()=>{ const n=$$('.addin').find(i=>i.dataset.key===k&&i.dataset.cat===cat); n?.focus(); },20); };
ACT.listReset = k => confirmBox('Add back the suggested items? Your own items stay.', ()=>{ const have=new Set(DB.lists[k].map(i=>i.text)); defaultsFor(k).forEach(i=>{ if(!have.has(i.text)) DB.lists[k].push(i); }); save(); render(); }, 'Restore');
ACT.itemEdit = arg => {
  const [k,id]=arg.split('|'), cfg=LISTS[k], it=DB.lists[k].find(x=>x.id===id); if(!it) return;
  const fld = cfg.fields.map(([f,l,t])=>{ if (t.startsWith('select:')) return `<div><label class="f">${l}</label><select data-f="${f}">${t.slice(7).split(',').map(o=>`<option ${it[f]===o?'selected':''}>${o}</option>`).join('')}</select></div>`; return `<div><label class="f">${l}</label><input type="${t}" data-f="${f}" value="${esc(it[f]??'')}" ${t==='number'?'step="any" min="0"':''}></div>`; }).join('');
  const ov = modal('Edit item', `<div class="sec"><label class="f">${k==='names'?'Name':k==='guests'?'Guest name':'Item'}</label><input type="text" id="it-t" value="${esc(it.text)}"></div><div class="grid g2 sec"><div><label class="f">${k==='names'?'For':'Group'}</label><select id="it-c">${cfg.cats.map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${fld}</div><label class="row sec small"><input type="checkbox" class="chk" id="it-d" ${it.done?'checked':''}> ${cfg.doneLabel}</label>`,
    `<button class="btn danger ghost" data-del style="margin-right:auto">Delete</button><button class="btn" data-c>Cancel</button><button class="btn pri" data-s>Save</button>`);
  $('[data-c]',ov).onclick = closeModal;
  $('[data-del]',ov).onclick = () => { DB.lists[k]=DB.lists[k].filter(x=>x.id!==id); save(); closeModal(); render(); };
  $('[data-s]',ov).onclick = () => { const t=$('#it-t',ov).value.trim(); if(!t){ toast('Add a name first'); return; } it.text=t; it.cat=$('#it-c',ov).value; it.done=$('#it-d',ov).checked; $$('[data-f]',ov).forEach(i=>{ const v=i.value.trim(); if (v==='') delete it[i.dataset.f]; else it[i.dataset.f] = i.type==='number'? +v : v; }); save(); closeModal(); render(); };
};

  g.fillStyle='rgba(255,255,255,.45)'; g.beginPath(); g.arc(470,140,120,0,7); g.fill();
  const r=60+week*3.2; g.fillStyle='#D9A9A2'; g.beginPath(); g.ellipse(300,470,r,r*1.08,0,0,7); g.fill();

    if (Object.keys(sym).length) DB.days[k].symptoms=sym;

  }

  for (let i=9;i>=0;i--){ if(!ch(.8)) continue; const t=pkey(addDays(tk,-i)); t.setHours(20,10+Math.floor(rnd()*40)); if (t.getTime()>Date.now()) continue; const mins=8+Math.floor(rnd()*22); DB.kicks.push({id:uid()+i, start:t.getTime(), end:t.getTime()+mins*60000, count:10}); }

  ap(-(gdNow-8*7),'09:30','Prenatal check-up','Dr. Lee','First visit — confirmed pregnancy, due date set.'); ap(-(gdNow-12*7),'11:00','Ultrasound','Imaging team','Saw the heartbeat! Everything looked good.'); ap(-(gdNow-20*7),'14:15','Ultrasound','Imaging team','Anatomy scan, baby measuring on track.'); ap(-(gdNow-25*7),'08:00','Glucose test','Lab','Results normal.'); ap(-12,'10:00','Prenatal check-up','Dr. Lee','Blood pressure fine, heartbeat strong.'); ap(5,'10:30','Prenatal check-up','Dr. Lee',''); ap(19,'15:00','Class','Birth center','Birth preparation class, bring a pillow.');
  DB.questions=[{id:uid(),text:'When should I call about contractions?',done:false},{id:uid()+'b',text:'Is the swelling in my feet normal for me?',done:false},{id:uid()+'c',text:'Can we talk through my birth plan?',done:false}];
  const L=DB.lists;
  L.todo.forEach(i=>{ if(i.cat==='First trimester') i.done=true; if(i.cat==='Second trimester') i.done=ch(.8); if(i.cat==='Third trimester') i.done=ch(.25); });
  L.bag.forEach(i=>i.done=ch(.35));
  const price={'Crib or bassinet':249,'Fitted crib sheets':36,'Baby monitor':89,'Changing pad':39,'Bottles':28,'Burp cloths':16,'Bibs':14,'Diapers':45,'Wipes':18,'Diaper cream':9,'Diaper bag':59,'Baby bathtub':25,'Hooded towels':22,'Gentle baby wash':10,'Bodysuits':24,'Sleep sacks':38,'Socks and hats':15,'Car seat':189,'Stroller':299,'Baby carrier':119,'Nail clippers':8,'Baby thermometer':19,'Outlet covers':7};
  L.registry.forEach(i=>{ if(price[i.text]) i.price=price[i.text]; i.done=ch(.45); });
  L.budget=[['Medical','Hospital deductible',1500,1500],['Medical','Prenatal classes',150,150],['Nursery','Crib and mattress',420,389],['Nursery','Paint and decor',150,96],['Gear','Car seat',190,189],['Gear','Stroller',300,0],['Clothing','Newborn clothes',200,135],['Feeding','Bottles and pump',180,0],['Other','Baby shower',250,210]].map(([cat,text,planned,actual],i)=>({id:uid()+i,cat,text,planned,actual,done:actual>0}));
  L.names=[['Girl','Olivia','Olive tree',1],['Girl','Hazel','The hazel tree',1],['Girl','Amelia','Work',0],['Girl','Isla','Island',0],['Boy','Theo','Gift of God',1],['Boy','Oliver','Olive tree',0],['Boy','Leo','Lion',0],['Either','River','Flowing water',0]].map(([cat,text,meaning,f],i)=>({id:uid()+i,cat,text,meaning,done:!!f}));
  L.guests=[['Family','Mom & Dad',2,'Yes','Stroller',1],['Family','Aunt Jen',1,'Yes','Blankets',1],['Family','Grandma Rose',1,'Yes','Knitted cardigan',0],['Friends','Emma & Josh',2,'Yes','Diaper cake',0],['Friends','Priya',1,'Maybe','',0],['Friends','Hannah',1,'Yes','Books',0],['Work','Team from the office',4,'Yes','Gift card',0],['Other','Neighbors',2,'No','',0]].map(([cat,text,count,rsvp,gift,d],i)=>({id:uid()+i,cat,text,count,rsvp,gift,done:!!d}));
  L.meals=[['Breakfast','Spinach & egg muffins',1],['Breakfast','Banana oat bars',0],['Lunch & dinner','Chicken pot pie',1],['Lunch & dinner','Beef & bean chili',1],['Lunch & dinner','Veggie lasagna',0],['Snacks','Lactation cookies',0]].map(([cat,text,d],i)=>({id:uid()+i,cat,text,done:!!d}));
  L.postpartum.forEach(i=>i.done=ch(.2));
  Object.assign(DB.birthplan,{provider:'Dr. Lee',place:'Riverside Hospital',support:'My partner Josh, and my mom for the first part of labor.',environment:'Dim lights, my own playlist, and as few interruptions as possible.',pain:'I would like to start with movement, the shower and breathing, and I am open to an epidural if I ask for one.',afterbirth:'Immediate skin-to-skin if baby is well. Delayed cord clamping, and Josh would like to cut the cord.',feeding:'I plan to breastfeed and would love support from a lactation consultant.'});
  DB.nursery.notes='Soft neutral nursery with blush accents. Rocking chair by the window, dresser doubles as a changing table.';
  const J=[[-1,'A letter to you, little one…','You were dancing again tonight, right after dinner. I put Dad\'s hand on my tummy and you kicked him twice. We can\'t wait to meet you.'],[-6,'How did your body feel this week?','Tired, a bit achy, but so grateful. The swelling is easier when I rest with my feet up.'],[-13,'What are you most looking forward to?','Holding you for the first time. And seeing who you look like!'],[-24,'A moment you want to remember from this week','We painted the nursery. It smells like fresh paint and new beginnings.'],[-40,'Something that made you smile today','Felt the very first flutter while sitting at my desk. I nearly cried.']];
  DB.journal=J.map(([o,p,t],i)=>({id:'j'+i+uid(), date:addDays(tk,o), week:Math.floor((gdNow+o)/7), prompt:p, text:t}));
  DB.bump=[];
  for (const wk of [12,16,20,24,28,30]){ const id='b'+wk+uid(); try{ await phPut(id, samplePhoto(wk)); DB.bump.push({id:uid()+wk, week:wk, date:addDays(tk,-(gdNow-wk*7)), photo:id}); }catch(e){} }
}

/* ---------- welcome ---------- */
function welcome(){
  let theme = DB.settings.theme;
  const ov = modal('Welcome <span style="color:var(--primary)">♡</span>', `
    <p class="muted" style="margin-top:12px">A calm, private place to follow your pregnancy week by week, and to plan everything for baby's arrival.</p>
    <div class="grid g2 sec"><div><label class="f">Your name <span class="faint">(optional)</span></label><input type="text" id="w-name" placeholder="Your first name" value="${esc(DB.settings.name)}"></div><div><label class="f">Due date <span class="faint">(you can add it later)</span></label><input type="date" id="w-due" value="${DB.settings.due||''}"></div></div>
    <div class="sec"><h4>Choose a look</h4><div class="grid g2" id="w-th">${THEMES.map(([k,l,c])=>`<div class="opt ${theme===k?'on':''}" data-k="${k}"><span class="swatch">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span>${l}</div>`).join('')}</div></div>
    <div class="private small" style="margin-top:16px">${ic('lock')} No account, no cloud, no subscription. Everything — even your photos — stays on this device.</div>`,
    `<button class="btn" data-demo>${ic('sparkle')} Explore with sample data</button><button class="btn pri" data-start>Start my tracker</button>`, {sticky:true});
  $('.x', ov).style.display='none';
  $('#w-th',ov).onclick = e => { const o=e.target.closest('.opt'); if(!o) return; theme=o.dataset.k; DB.settings.theme=theme; document.documentElement.dataset.theme=theme; $$('.opt',ov).forEach(x=>x.classList.toggle('on',x===o)); };
  const done = async demo => { DB.settings.name=$('#w-name',ov).value.trim(); DB.settings.due=$('#w-due',ov).value||DB.settings.due; DB.settings.setup=true; if (demo){ await makeDemo(); DB.settings.demo=true; } save(); closeModal(); render(); if(demo) toast('Sample data loaded — clear it any time in Settings'); };
  $('[data-start]',ov).onclick = () => done(false); $('[data-demo]',ov).onclick = () => done(true);
}

/* ---------- init ---------- */
load(); ensureLists();
$('#logo').innerHTML = LOGO;
render();
if (!DB.settings.setup) welcome();
window.addEventListener('afterprint', ()=>{ $('#print').innerHTML=''; });
let rzT, lastW = innerWidth; window.addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if ((innerWidth<760)!==(lastW<760) && !$('#ov')) render(); lastW=innerWidth; },200); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
